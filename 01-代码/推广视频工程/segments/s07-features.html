<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>07 功能</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp } from '../common.js';
import { TC, termWindow, termScript, termHUD, termProgress } from '../terminal.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment();

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';

const WIN = { x: 140, y: 150, w: 1640, h: 812, headH: 54 };
const X0 = WIN.x + 56;
const Y0 = WIN.y + WIN.headH + 56;
const LH = 40;

// 一个面板管完：模块清单 + 这一版新增的两个特性
const SCRIPT = [
  { at: 0.4, k: '$', t: '' },
  { at: 0.9, k: 'c', t: '这些能力都在一个面板里' },
  { at: 2.8, k: '$', t: 'ghost-firewall panel --list' },
  { at: 4.1, k: 'o', t: 'Name              Description', dim: true },
  { at: 4.4, k: 'o', t: '端口敲门            敲对序列才放行' },
  { at: 4.7, k: 'o', t: '端口转发            TCP / UDP 双栈' },
  { at: 5.0, k: 'o', t: '反代管理            Nginx 反代 + SSL' },
  { at: 5.3, k: 'o', t: 'DNS 局域网解析       域名写进 dnsmasq' },
  { at: 5.6, k: 'o', t: 'DDNS                多服务商动态域名' },
  { at: 5.9, k: 'o', t: '国外 IP 拦截         自动拦境外 IP' },
  { at: 6.2, k: 'o', t: '日志管理            开关 + 远程转发' },
  { at: 6.5, k: 'c', t: '点开就改，不用 SSH 手写文件' },
  { at: 9.0, k: '$', t: 'ghost-firewall panel --new' },
  { at: 10.0, k: 'o', t: '[new] 证书域名自动写入 dnsmasq · LAN 里直接用域名访问', accent: true },
  { at: 10.3, k: 'o', t: '[new] 多 LAN 口时，面板会提醒先排除二层环路', accent: true },
  { at: 10.7, k: 'c', t: '前端零构建、零 CDN，不连任何外部域名' },
  { at: 12.8, k: '$', t: '' },
];

window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = TC.bg;
  ctx.fillRect(0, 0, W, H);

  termWindow(ctx, {
    x: WIN.x, y: WIN.y, w: WIN.w, h: WIN.h, headH: WIN.headH,
    title: '~/ghost-firewall', right: 'zsh', font: MONO,
    alpha: clamp(u / 0.45),
  });

  termScript(ctx, SCRIPT, { u, x: X0, y: Y0, lineH: LH, font: MONO });

  termHUD(ctx, { index: 7, chapter: '功能', font: MONO });
  termProgress(ctx, { u, duration: seg.duration, font: MONO, x: WIN.x, y: 996, w: WIN.w });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
</script>
</body>
</html>
