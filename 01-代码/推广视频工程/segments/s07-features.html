<!doctype html>
<html lang="zh-CN">

<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp, ease, TAU, drawCapsuleLabel, drawStamp } from '../common.js';
import { themeFromURL, chrome, drawGrain, drawVignette } from '../themes.js';
import { drawParticleField, drawLightSweep, drawEdgeSweep, breathe } from '../motion.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const theme = themeFromURL(location.search);
const HUD = chrome(theme);
const seg = createSegment({ duration: 28 });

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

// ---------- 调色板（coral-noir，与讲解页同一套） ----------
const C = {
  bg: '#0e0e0d', surface: '#1a1917', ink: '#f5f0e8', mid: '#b9b2a8', muted: '#8f8981',
  accent: '#d97757', accentSoft: '#f0b49c', line: 'rgba(245,240,232,0.10)',
  ok: '#7fc7a4', warn: '#dda44c',
};
const SANS = '"Noto Sans SC", sans-serif';
const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';

// ---------- 文案（timeline.json 的 copy 字段，唯一真相源，逐字照抄） ----------
const KICKER = '十三块，拼在一起';
const TITLE = '一个面板管完路由器';
const PUNCH = '零构建、零 CDN —— 前端不连任何外部域名';

// 面板侧栏的十三个模块（README「功能一览」的模块名与一句话说明）
const MODULES = [
  { name: '防火墙状态', desc: '规则实时查看' },
  { name: '网络接口', desc: 'PPPoE + 网关 IP' },
  { name: '端口敲门', desc: '敲对序列才放行' },
  { name: '端口转发', desc: 'TCP / UDP 双栈' },
  { name: '访问控制', desc: 'LAN / 信任 IP 模式' },
  { name: '日志管理', desc: '开关 + 远程转发' },
  { name: '系统日志', desc: '审计时间线，可导出' },
  { name: '国外 IP 拦截', desc: '自动拦境外 IP' },
  { name: 'DNS 局域网解析', desc: '域名写进 dnsmasq' },
  { name: 'DDNS', desc: '多服务商动态域名' },
  { name: '名单管理', desc: 'IP 黑白名单' },
  { name: '反代管理', desc: 'Nginx 反代 + SSL' },
  { name: '认证网关', desc: '单端口汇聚所有服务' },
];
// 本轮新增的两个能力：总览时带「新」标记
const NEW_MODULES = ['DNS 局域网解析', '网络接口'];

// 右侧内容区依次演示的五个页面
const DEMO = [
  { tab: '防火墙状态', head: 'nftables 规则已加载 · 默认策略 drop' },
  { tab: '端口敲门', head: '4 步序列 · 每步 8 秒内接上' },
  { tab: '反代管理', head: 'SSL 手动上传 + ACME 自动申请，多 DNS 服务商' },
  { tab: 'DNS 局域网解析', head: '证书域名自动写入 dnsmasq' },
  { tab: '网络接口', head: '多 LAN 口时提示先排除二层环路' },
];

// ---------- 版面常量 ----------
const HEAD = { kickerY: 172, titleY: 258 };
const WIN = { x: 96, y: 300, w: 1728, h: 650 };   // 浏览器窗口
const BAR_H = 48;                                  // 地址栏
const SIDE = { x: WIN.x, y: WIN.y + BAR_H, w: 306, h: WIN.h - BAR_H };
const MAIN = { x: WIN.x + SIDE.w, y: WIN.y + BAR_H, w: WIN.w - SIDE.w, h: WIN.h - BAR_H };
const PAD = 40;                                    // 内容区内边距
const NAV_Y0 = SIDE.y + 46;                        // 侧栏第一项基线
const NAV_STEP = 40;                               // 侧栏行距
const PUNCH_Y = 1000;

// ---------- 节拍表（120 BPM，每拍 0.5s） ----------
//   0.0-0.8   kicker 淡入
//   0.5-1.4   title 落下（outBack）
//   1.3-2.1   浏览器窗口打开（缩放 + 淡入）
//   1.9-5.6   侧栏十三个模块逐条浮现
//   2.3-6.0   页面一：防火墙状态（规则表逐行落下）
//   6.0-10.4  页面二：端口敲门（四步依次点亮 → @allowed4）
//  10.4-14.4  页面三：反代管理（域名 + 证书）
//  14.4-18.4  页面四：DNS 局域网解析（写入 dnsmasq 提示）
//  18.4-22.4  页面五：网络接口（二层环路警告）
//  22.4-24.0  页面六：十三个模块总览（拼在一起）
//  24.4-25.2  punchline 落下
//  25.2-28.0  保持静帧
// ============================================================

// 屏幕切换表：mod 是侧栏高亮的模块下标，kind 决定画哪个页面
const SCREENS = [
  { mod: 0, kind: 'rules', t0: 2.3, t1: 6.0 },
  { mod: 2, kind: 'knock', t0: 6.0, t1: 10.4 },
  { mod: 11, kind: 'proxy', t0: 10.4, t1: 14.4 },
  { mod: 8, kind: 'dns', t0: 14.4, t1: 18.4 },
  { mod: 1, kind: 'iface', t0: 18.4, t1: 22.4 },
  { mod: -1, kind: 'all', t0: 22.4, t1: 60 },
];

// ---------- 文本小工具 ----------
function setFont(size, weight = 400, family = SANS) {
  ctx.font = `${weight} ${size}px ${family}`;
}

// 按可用宽度收缩字号：中文长短差异大，固定字号会压出框
function fitFont(text, maxW, size, weight = 400, family = SANS) {
  let s = size;
  setFont(s, weight, family);
  while (s > 11 && ctx.measureText(text).width > maxW) {
    s -= 1;
    setFont(s, weight, family);
  }
  return s;
}

function text(str, x, y, opts = {}) {
  const { size = 20, weight = 400, color = C.ink, family = SANS, align = 'left', alpha = 1 } = opts;
  ctx.save();
  ctx.globalAlpha = alpha;
  setFont(size, weight, family);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(str, x, y);
  ctx.restore();
}

function roundBox(x, y, w, h, r, fill, stroke, lw = 1.4) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

// ---------- 头部：kicker + 主标题 ----------
function drawHeadline(u) {
  const kp = clamp(u / 0.8, 0, 1);
  if (kp > 0) {
    const e = ease.outCubic(kp);
    ctx.save();
    ctx.globalAlpha = e;
    setFont(30, 500, MONO);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = C.accent;
    ctx.fillText(KICKER, WIN.x, HEAD.kickerY);
    ctx.fillStyle = 'rgba(217,119,87,0.5)';
    ctx.fillRect(WIN.x, HEAD.kickerY + 16, 240 * e, 2);
    ctx.restore();
  }

  const tp = clamp((u - 0.5) / 0.9, 0, 1);
  if (tp > 0) {
    const e = ease.outBack(tp);
    ctx.save();
    ctx.globalAlpha = clamp(tp * 2, 0, 1);
    ctx.translate(0, (1 - e) * -26);
    setFont(64, 700);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = C.ink;
    ctx.fillText(TITLE, WIN.x, HEAD.titleY);
    ctx.restore();
  }
}

// ---------- 浏览器窗框：外框 + 地址栏 ----------
// 缩放由调用方统一做（窗口整体开合），这里只画窗体本身
function drawWindow(u) {
  // 窗口体
  roundBox(WIN.x, WIN.y, WIN.w, WIN.h, 18, '#141312', 'rgba(245,240,232,0.16)', 1.6);
  // 地址栏
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(WIN.x, WIN.y, WIN.w, WIN.h, 18);
  ctx.clip();
  ctx.fillStyle = 'rgba(245,240,232,0.05)';
  ctx.fillRect(WIN.x, WIN.y, WIN.w, BAR_H);
  ctx.strokeStyle = C.line;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(WIN.x, WIN.y + BAR_H);
  ctx.lineTo(WIN.x + WIN.w, WIN.y + BAR_H);
  ctx.stroke();
  ctx.restore();

  // 三个圆点
  const dots = ['rgba(245,240,232,0.24)', 'rgba(245,240,232,0.16)', 'rgba(245,240,232,0.11)'];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = dots[i];
    ctx.beginPath();
    ctx.arc(WIN.x + 28 + i * 22, WIN.y + BAR_H / 2, 5, 0, TAU);
    ctx.fill();
  }

  // 地址胶囊
  const pill = { x: WIN.x + 108, y: WIN.y + 10, w: 420, h: BAR_H - 20 };
  roundBox(pill.x, pill.y, pill.w, pill.h, 12, 'rgba(245,240,232,0.06)', 'rgba(245,240,232,0.10)', 1);
  text('https://192.168.1.1:5443/', pill.x + 18, pill.y + 20, { size: 16, family: MONO, color: C.muted });

  // 右上角产品名
  text('Ghost Firewall', WIN.x + WIN.w - 28, WIN.y + BAR_H / 2 + 6, {
    size: 18, weight: 600, family: MONO, color: C.accent, align: 'right',
  });
}

// ---------- 侧栏：十三个模块 ----------
function drawSidebar(u) {
  const active = currentScreen(u);
  for (let i = 0; i < MODULES.length; i++) {
    const m = MODULES[i];
    const p = clamp((u - (1.9 + i * 0.28)) / 0.4, 0, 1);
    if (p <= 0) continue;
    const e = ease.outCubic(p);
    const y = NAV_Y0 + i * NAV_STEP;
    const isActive = active && active.mod === i;
    const visited = isVisited(i, u);

    ctx.save();
    ctx.globalAlpha = e;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    if (isActive) {
      // 当前页：左侧 accent 竖条 + 底色
      roundBox(SIDE.x + 10, y - 24, SIDE.w - 28, 32, 8, 'rgba(217,119,87,0.14)', null);
      ctx.fillStyle = C.accent;
      ctx.beginPath();
      ctx.roundRect(SIDE.x + 10, y - 22, 3, 28, 2);
      ctx.fill();
    }

    // 圆点：当前页实心 accent，去过的实心 muted，其余空心
    ctx.beginPath();
    ctx.arc(SIDE.x + 34, y - 6, 4, 0, TAU);
    if (isActive) {
      ctx.fillStyle = C.accent;
      ctx.fill();
    } else if (visited) {
      ctx.fillStyle = 'rgba(245,240,232,0.38)';
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(245,240,232,0.22)';
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }

    text(m.name, SIDE.x + 52, y, {
      size: 20,
      weight: isActive ? 600 : 400,
      color: isActive ? C.ink : C.mid,
    });
    ctx.restore();
  }

  // 侧栏与内容区之间的分隔线
  ctx.strokeStyle = C.line;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(SIDE.x + SIDE.w, SIDE.y + 8);
  ctx.lineTo(SIDE.x + SIDE.w, SIDE.y + SIDE.h - 8);
  ctx.stroke();

  // 侧栏底部：与真实面板一致的一句提示
  const fp = clamp((u - 5.6) / 0.5, 0, 1);
  if (fp > 0) {
    text('仅限内网访问', SIDE.x + 34, SIDE.y + SIDE.h - 28, {
      size: 15, color: 'rgba(245,240,232,0.30)', alpha: ease.outCubic(fp),
    });
  }
}

// 当前该高亮哪个页面
function currentScreen(u) {
  let cur = null;
  for (const s of SCREENS) if (u >= s.t0) cur = s;
  return cur;
}

// 演示里已经露过脸的模块
function isVisited(i, u) {
  for (const s of SCREENS) {
    if (s.mod !== i) continue;
    if (u >= s.t0) return true;
  }
  return false;
}

// 面板内的扫描线（跟 s01 同一套语言）
function drawPanelScan(u) {
  const period = 7;
  const cyc = (u % period) / period;
  const fade = Math.sin(Math.PI * cyc);
  if (fade <= 0.01) return;
  const sy = MAIN.y + cyc * MAIN.h;
  ctx.save();
  const g = ctx.createLinearGradient(0, sy - 70, 0, sy);
  g.addColorStop(0, 'rgba(217,119,87,0)');
  g.addColorStop(1, `rgba(217,119,87,${(0.055 * fade).toFixed(3)})`);
  ctx.fillStyle = g;
  ctx.fillRect(MAIN.x, sy - 70, MAIN.w, 70);
  ctx.strokeStyle = `rgba(217,119,87,${(0.16 * fade).toFixed(3)})`;
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(MAIN.x, sy);
  ctx.lineTo(MAIN.x + MAIN.w, sy);
  ctx.stroke();
  ctx.restore();
}

// 侧栏上的光标：跟着当前页走，换页时点一下
function drawCursor(u) {
  const sc = currentScreen(u);
  if (!sc || sc.mod < 0) return;
  const y = NAV_Y0 + sc.mod * NAV_STEP - 6;
  const x = SIDE.x + 40;
  const rp = clamp((u - sc.t0) / 0.45, 0, 1);
  ctx.save();
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = C.accent;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + 7, y + 4.5);
  ctx.lineTo(x, y + 9);
  ctx.closePath();
  ctx.fill();
  // 换页时的点击涟漪
  if (rp < 1) {
    ctx.strokeStyle = `rgba(217,119,87,${(0.65 * (1 - rp)).toFixed(3)})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(x + 2, y + 4, 5 + rp * 24, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- 内容区通用外框：标题 + 副标题 + 右上角按钮 ----------
function paneHead(title, head, alpha) {
  text(title, MAIN.x + PAD, MAIN.y + 58, { size: 30, weight: 700, color: C.ink, alpha });
  if (head) {
    text(head, MAIN.x + PAD, MAIN.y + 90, { size: 18, color: C.muted, alpha });
  }
  // 右上角两个按钮（真实面板里也有保存 / 应用）
  const btns = ['保存配置', '应用规则'];
  let bx = MAIN.x + MAIN.w - PAD;
  for (let i = btns.length - 1; i >= 0; i--) {
    setFont(16, 500);
    const w = ctx.measureText(btns[i]).width + 34;
    bx -= w;
    roundBox(bx, MAIN.y + 26, w, 34, 8, 'rgba(245,240,232,0.05)', 'rgba(245,240,232,0.12)', 1);
    text(btns[i], bx + 17, MAIN.y + 48, { size: 16, color: C.mid, alpha });
    bx -= 12;
  }
}

// 内容区底部的一行说明
function paneFoot(str, u, alpha, delay = 1.2) {
  const p = clamp((u - delay) / 0.5, 0, 1);
  if (p <= 0) return;
  text(str, MAIN.x + PAD, MAIN.y + MAIN.h - 44, {
    size: 16, color: 'rgba(245,240,232,0.34)', alpha: alpha * ease.outCubic(p),
  });
}

// ---------- 页面一：防火墙状态（规则表） ----------
const RULE_ROWS = [
  ['inet', 'input', 'accept', 'tcp dport 5443 accept'],
  ['inet', 'input', 'drop', '默认策略拒绝'],
  ['inet', 'forward', 'drop', '国外 IP 拦截'],
  ['inet', 'nat', 'prerouting', '端口转发 → 192.168.1.10:5443'],
];
const RULE_COUNTS = [312, 1284, 96, 41];

function screenRules(u, s, alpha) {
  paneHead(DEMO[0].tab, DEMO[0].head, alpha);
  paneFoot('先保存配置，再应用规则', u, alpha, s.t0 + 1.5);

  // 三个统计胶囊
  const chips = ['规则 42 条', '命中 1284 包', '最后应用 12 秒前'];
  let cx = MAIN.x + PAD;
  for (let i = 0; i < chips.length; i++) {
    const p = clamp((u - (s.t0 + 0.2 + i * 0.18)) / 0.4, 0, 1);
    if (p <= 0) continue;
    const e = ease.outCubic(p);
    setFont(16, 500);
    const w = ctx.measureText(chips[i]).width + 36;
    ctx.save();
    ctx.globalAlpha = alpha * e;
    roundBox(cx, MAIN.y + 116, w, 36, 8, 'rgba(217,119,87,0.10)', 'rgba(217,119,87,0.28)', 1);
    text(chips[i], cx + 18, MAIN.y + 140, { size: 16, color: C.accentSoft, alpha: e });
    ctx.restore();
    cx += w + 14;
  }

  // 规则表：表头 + 四行
  const cols = [0, 120, 250, 430, 560];
  const ty = MAIN.y + 196;
  const heads = ['表', '链', '策略', '计数', '规则'];
  for (let i = 0; i < heads.length; i++) {
    text(heads[i], MAIN.x + PAD + cols[i], ty, { size: 15, color: 'rgba(245,240,232,0.32)', alpha });
  }
  ctx.strokeStyle = C.line;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(MAIN.x + PAD, ty + 12);
  ctx.lineTo(MAIN.x + MAIN.w - PAD, ty + 12);
  ctx.stroke();

  for (let r = 0; r < RULE_ROWS.length; r++) {
    const p = clamp((u - (s.t0 + 0.35 + r * 0.32)) / 0.4, 0, 1);
    if (p <= 0) continue;
    const e = ease.outCubic(p);
    const y = ty + 48 + r * 62;
    ctx.save();
    ctx.globalAlpha = alpha * e;
    ctx.translate((1 - e) * 18, 0);
    const cells = RULE_ROWS[r];
    // 表与链用等宽英文
    text(cells[0], MAIN.x + PAD + cols[0], y, { size: 18, family: MONO, color: C.mid });
    text(cells[1], MAIN.x + PAD + cols[1], y, { size: 18, family: MONO, color: C.mid });
    text(cells[2], MAIN.x + PAD + cols[2], y, {
      size: 18, family: MONO,
      color: cells[2] === 'accept' ? C.ok : C.accent,
    });
    // 计数随时间往上走（确定性：按段内时间线性增长）
    const cnt = RULE_COUNTS[r] + Math.floor((u - s.t0) * 12);
    text(String(cnt), MAIN.x + PAD + cols[3], y, { size: 18, family: MONO, color: C.ink });
    text(cells[3], MAIN.x + PAD + cols[4], y, { size: 17, color: C.mid });
    ctx.restore();
  }
}

// 自己画一个勾（字体里没有 ✓ 的字形，画一个不依赖字体）
function drawTick(x, y, s, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = s * 0.16;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.5);
  ctx.lineTo(x + s * 0.36, y + s * 0.85);
  ctx.lineTo(x + s, y + s * 0.12);
  ctx.stroke();
  ctx.restore();
}

// ---------- 页面二：端口敲门（四步依次点亮） ----------
const KNOCK_STEPS = ['knock1', 'knock2', 'knock3', 'knock4'];
const KNOCK_T = [6.4, 7.2, 8.0, 8.8];

function screenKnock(u, s, alpha) {
  paneHead(DEMO[1].tab, DEMO[1].head, alpha);
  paneFoot('顺序敲错会进惩罚窗口，30 秒内敲什么都不算', u, alpha, s.t0 + 2.0);

  const cardW = 320, gap = 26, y = MAIN.y + 150, h = 168;
  for (let i = 0; i < 4; i++) {
    const lit = u >= KNOCK_T[i];
    const p = clamp((u - KNOCK_T[i]) / 0.35, 0, 1);
    const e = ease.outCubic(p);
    const x = MAIN.x + PAD + i * (cardW + gap);

    ctx.save();
    ctx.globalAlpha = alpha * (lit ? 1 : 0.35);
    roundBox(x, y, cardW, h, 12,
      lit ? 'rgba(217,119,87,0.10)' : 'rgba(245,240,232,0.03)',
      lit ? 'rgba(217,119,87,0.45)' : C.line, 1.4);

    text(`第 ${i + 1} 步`, x + 24, y + 40, { size: 16, color: C.muted });
    text(KNOCK_STEPS[i], x + 24, y + 88, {
      size: 28, weight: 600, family: MONO,
      color: lit ? C.accentSoft : C.mid,
    });

    // 8 秒超时窗口：亮起后开始缩短；窗口走完就翻成「已完成」
    if (lit) {
      const span = 0.95;                       // 8 秒窗口在画面上压缩成不到 1 秒
      const q = clamp((u - KNOCK_T[i]) / span, 0, 1);
      const bw = cardW - 48;
      if (q < 1) {
        roundBox(x + 24, y + 116, bw, 6, 3, 'rgba(245,240,232,0.10)', null);
        ctx.fillStyle = q > 0.75 ? C.warn : C.accent;
        ctx.beginPath();
        ctx.roundRect(x + 24, y + 116, Math.max(2, bw * (1 - q)), 6, 3);
        ctx.fill();
        const left = Math.max(0, 8 - Math.floor(q * 8));
        text(`剩余 ${left} 秒`, x + 24, y + 148, { size: 15, color: q > 0.75 ? C.warn : C.muted });
      } else {
        // 窗口已过：自己画一个勾（字体里没有 ✓ 的字形）
        drawTick(x + 30, y + 124, 16, C.ok);
        text('已完成', x + 58, y + 148, { size: 15, color: 'rgba(127,199,164,0.75)' });
      }
    } else {
      text('待敲', x + 24, y + 148, { size: 15, color: 'rgba(245,240,232,0.28)' });
    }
    ctx.restore();
  }

  // 四步走完：来源 IP 进白名单
  const bp = clamp((u - 9.3) / 0.5, 0, 1);
  if (bp > 0) {
    const e = ease.outCubic(bp);
    ctx.save();
    ctx.globalAlpha = alpha * e;
    ctx.translate(0, (1 - e) * 14);
    const label = '@allowed4';
    setFont(24, 600, MONO);
    const w = ctx.measureText(label).width + 200;
    const bx = MAIN.x + PAD, by = y + h + 34;
    roundBox(bx, by, w, 52, 10, 'rgba(127,199,164,0.10)', 'rgba(127,199,164,0.40)', 1.2);
    text(label, bx + 24, by + 34, { size: 24, weight: 600, family: MONO, color: C.ok });
    text('来源 IP 已进白名单 · 5 小时', bx + 24 + ctx.measureText(label).width + 26, by + 34, {
      size: 18, color: C.mid,
    });
    ctx.restore();
  }
}

// ---------- 页面三：反代管理（域名 + 证书） ----------

// ---------- 页面四：DNS 局域网解析（新增能力） ----------
const DNS_ROWS = [

}

// ---------- 页面五：网络接口（新增能力：二层环路提示） ----------

// ---------- 页面六：十三个模块总览 ----------
// 5 列 × 3 行 = 15 格：13 个模块占前 13 格，末行剩下 2 格合成一块收尾格，
// 网格不留空位（留空看着像缺东西）
function screenAll(u, s, alpha) {
  const cols = 5, gap = 14;
  const gridW = MAIN.w - PAD * 2;
  const tileW = (gridW - gap * (cols - 1)) / cols;
  const tileH = 118;
  const y0 = MAIN.y + 150;

  text('十三个模块，一个面板', MAIN.x + PAD, MAIN.y + 58, { size: 30, weight: 700, color: C.ink, alpha });
  text('配置、状态、日志、证书、DDNS 都在同一个侧栏里', MAIN.x + PAD, MAIN.y + 90, {
    size: 18, color: C.muted, alpha,
  });

  for (let i = 0; i < MODULES.length; i++) {
    const m = MODULES[i];
    const p = clamp((u - (s.t0 + 0.15 + i * 0.12)) / 0.35, 0, 1);
    if (p <= 0) continue;
    const e = ease.outCubic(p);
    const cx = MAIN.x + PAD + (i % cols) * (tileW + gap);
    const cy = y0 + Math.floor(i / cols) * (tileH + gap);

    ctx.save();
    ctx.globalAlpha = alpha * e;
    ctx.translate(0, (1 - e) * 12);
    const isNew = NEW_MODULES.includes(m.name);
    roundBox(cx, cy, tileW, tileH, 12,
      isNew ? 'rgba(217,119,87,0.09)' : 'rgba(245,240,232,0.04)',
      isNew ? 'rgba(217,119,87,0.40)' : C.line, 1.2);
    // 左侧 accent 竖条
    ctx.fillStyle = isNew ? 'rgba(217,119,87,0.75)' : 'rgba(245,240,232,0.16)';
    ctx.beginPath();
    ctx.roundRect(cx + 1, cy + 18, 3, tileH - 36, 2);
    ctx.fill();

    const nameSize = fitFont(m.name, tileW - 64, 20, 600);
    text(m.name, cx + 22, cy + 52, { size: nameSize, weight: 600, color: isNew ? C.accentSoft : C.ink });
    const descSize = fitFont(m.desc, tileW - 44, 15, 400);
    text(m.desc, cx + 22, cy + 84, { size: descSize, color: C.muted });

    if (isNew) {
      roundBox(cx + tileW - 44, cy + 14, 30, 23, 6, C.accent, null);
      text('新', cx + tileW - 29, cy + 31, { size: 14, weight: 600, color: C.bg, align: 'center' });
    }
    ctx.restore();
  }

  // 末行合并格：13 块之外的收尾
  const sp = clamp((u - (s.t0 + 1.8)) / 0.4, 0, 1);
  if (sp > 0) {
    const e = ease.outCubic(sp);
    const cx = MAIN.x + PAD + 3 * (tileW + gap);
    const cy = y0 + 2 * (tileH + gap);
    const w = tileW * 2 + gap;
    ctx.save();
    ctx.globalAlpha = alpha * e;
    roundBox(cx, cy, w, tileH, 12, 'rgba(217,119,87,0.07)', 'rgba(217,119,87,0.28)', 1.2);
    text('Ghost Firewall', cx + 28, cy + 58, { size: 22, weight: 600, family: MONO, color: C.accentSoft });
    text('个人公网防火墙', cx + 28, cy + 90, { size: 16, color: C.muted });
    ctx.restore();
  }
}

// ---------- 收束：punchline ----------
function drawPunch(u) {
  const p = clamp((u - 24.4) / 0.8, 0, 1);
  if (p <= 0) return;
  const e = ease.outCubic(p);
  ctx.save();
  ctx.globalAlpha = e;
  ctx.fillStyle = 'rgba(217,119,87,0.4)';
  ctx.fillRect(960 - 150 * e, 968, 300 * e, 2);
  setFont(40, 600);
  ctx.fillStyle = C.accent;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(PUNCH, 960, PUNCH_Y);
  ctx.restore();
}

// ============================================================
window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  drawGrain(ctx, theme, W, H, u);

  // 窗外的浮尘：面板是浮在这层雾上的
  drawParticleField(ctx, { u, count: 120, seed: 103, color: '217,119,87', baseAlpha: 0.34, drift: 30 });

  drawHeadline(u);

  // 窗口内的内容跟着窗口一起缩放
  const wp = clamp((u - 1.3) / 0.8, 0, 1);
  if (wp > 0) {
    const e = ease.outCubic(wp);
    const s = 0.965 + 0.035 * e;
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(WIN.x + WIN.w / 2, WIN.y + WIN.h / 2);
    ctx.scale(s, s);
    ctx.translate(-(WIN.x + WIN.w / 2), -(WIN.y + WIN.h / 2));

    drawWindow(u);

    // 窗框上沿的流光
    drawEdgeSweep(ctx, { x: WIN.x + 20, y: WIN.y, w: WIN.w - 40, u, period: 6.0, color: '240,180,156', strength: 0.55 });

    drawSidebar(u);
    drawCursor(u);

    // 内容区底板
    ctx.fillStyle = 'rgba(245,240,232,0.02)';
    ctx.fillRect(MAIN.x, MAIN.y, MAIN.w, MAIN.h);

    // 面板里的扫描线：内容区一直在刷新
    drawPanelScan(u);

    // 逐屏绘制，切换处交叉淡入淡出
    for (const sc of SCREENS) {
      const fin = ease.outCubic(clamp((u - sc.t0) / 0.4));
      const fout = ease.outCubic(clamp((sc.t1 - u) / 0.3));
      const a = fin * fout;
      if (a <= 0.001) continue;
      ctx.save();
      ctx.globalAlpha = a;
      if (sc.kind === 'rules') screenRules(u, sc, 1);
      else if (sc.kind === 'knock') screenKnock(u, sc, 1);
      else if (sc.kind === 'proxy') screenProxy(u, sc, 1);
      else if (sc.kind === 'dns') screenDns(u, sc, 1);
      else if (sc.kind === 'iface') screenIface(u, sc, 1);
      else if (sc.kind === 'all') screenAll(u, sc, 1);
      ctx.restore();
    }
    ctx.restore();
  }

  drawPunch(u);
  drawLightSweep(ctx, { x: 0, y: 0, w: W, h: H, u, period: 8.4, strength: 0.04, band: 0.45 });
  drawVignette(ctx, W, H, 0.42);

  // HUD
  drawCapsuleLabel(ctx, 7, '功能全景', '功能', {
    numberColor: HUD.capsule.numberColor, textColor: HUD.capsule.textColor,
    bg: HUD.capsule.bg, border: HUD.capsule.border,
  });
  drawStamp(ctx, 'GHOST FIREWALL', { color: HUD.stamp.color });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono', 'Inter']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
