<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>06 认证</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp } from '../common.js';
import { TC, termWindow, termScript, termHUD, termProgress } from '../terminal.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment();

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';

const WIN = { x: 140, y: 160, w: 1640, h: 732, headH: 54 };
const X0 = WIN.x + 56;
const Y0 = WIN.y + WIN.headH + 56;
const LH = 40;

// 敲门只是让路，进门还得有钥匙：一套凭据管所有服务，谁来过都有记录
const SCRIPT = [
  { at: 0.4, k: '$', t: '' },
  { at: 0.9, k: 'c', t: '敲对了门只是让了路，进门还得有钥匙' },
  { at: 3.2, k: '$', t: 'ghost-firewall auth status' },
  { at: 4.4, k: 'o', t: 'entry        : 8443             (public)' },
  { at: 4.7, k: 'o', t: 'backend      : 127.0.0.1:8444   (loopback only)' },
  { at: 5.0, k: 'o', t: 'credentials  : one set for every service behind the gate' },
  { at: 5.6, k: 'c', t: '所有服务共用一套凭据，登录一次就全通了' },
  { at: 7.9, k: '$', t: 'tail -n 3 /var/log/ghost-firewall/audit.log' },
  { at: 8.9, k: 'o', t: '20:39:11  login ok   src=203.0.113.7' },
  { at: 9.2, k: 'o', t: '20:41:02  login ok   src=203.0.113.7' },
  { at: 9.5, k: 'o', t: '20:44:18  login ok   src=203.0.113.7' },
  { at: 9.9, k: 'c', t: '谁进来过、访问了什么，审计日志都有' },
  { at: 12.0, k: '$', t: 'curl -s http://127.0.0.1:8443/' },
  { at: 13.0, k: 'o', t: 'Ghost Firewall —— 请选择服务' },
  { at: 13.4, k: 'c', t: '一处登录，处处通行' },
];

window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = TC.bg;
  ctx.fillRect(0, 0, W, H);

  termWindow(ctx, {
    x: WIN.x, y: WIN.y, w: WIN.w, h: WIN.h, headH: WIN.headH,
    title: '~/ghost-firewall', right: 'zsh', font: MONO,
    alpha: clamp(u / 0.45),
  });

  termScript(ctx, SCRIPT, { u, x: X0, y: Y0, lineH: LH, font: MONO });

  termHUD(ctx, { index: 6, chapter: '认证', font: MONO });
  termProgress(ctx, { u, duration: seg.duration, font: MONO, x: WIN.x, y: 996, w: WIN.w });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
</script>
</body>
</html>
