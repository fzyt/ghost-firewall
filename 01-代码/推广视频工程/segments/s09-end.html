<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>09 收尾</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp, ease } from '../common.js';
import { TC, termWindow, termScript, termHUD, termProgress, typeText } from '../terminal.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment();

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';
const SANS = '"Noto Sans SC", sans-serif';

const WIN = { x: 140, y: 180, w: 1640, h: 652, headH: 54 };
const X0 = WIN.x + 56;
const Y0 = WIN.y + WIN.headH + 56;
const LH = 40;

const BRAND_AT = 14.6;   // clear 之后换成品牌定格

const SCRIPT = [
  { at: 0.4, k: '$', t: '' },
  { at: 0.9, k: '$', t: 'git clone https://github.com/fzyt/ghost-firewall.git' },
  { at: 3.2, k: 'o', t: "Cloning into 'ghost-firewall'..." },
  { at: 4.2, k: 'o', t: 'remote: Enumerating objects: 1284, done.' },
  { at: 4.8, k: 'o', t: 'Receiving objects: 100% (1284/1284), 412.05 KiB | 1.02 MiB/s, done.' },
  { at: 5.2, k: '$', t: 'cd ghost-firewall && ls' },
  { at: 6.2, k: 'o', t: 'backend  frontend  setup  README.md' },
  { at: 6.6, k: 'c', t: 'Ghost Firewall —— 把内网服务暴露到公网' },
  { at: 8.4, k: 'c', t: '但只暴露一个必须认证的入口' },
  { at: 10.0, k: '$', t: 'echo https://github.com/fzyt/ghost-firewall' },
  { at: 11.0, k: 'o', t: 'https://github.com/fzyt/ghost-firewall' },
  { at: 11.4, k: 'c', t: '整片画面由代码逐帧渲染 · 配乐由 numpy 合成 · 全程零生成模型' },
  { at: 13.2, k: '$', t: 'clear' },
];

// 品牌定格：字距拉开的品名 + 一行 tagline + 仓库地址
function drawBrand(u) {
  const p = clamp((u - BRAND_AT) / 0.9);
  if (p <= 0) return;
  const e = ease.outCubic(p);

  ctx.save();
  ctx.globalAlpha = e;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  ctx.font = `600 74px ${MONO}`;
  const name = 'GHOST FIREWALL';
  const gap = 14;
  const widths = [...name].map((c) => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + gap * (name.length - 1);
  let cx = W / 2 - total / 2;
  ctx.textAlign = 'left';
  ctx.fillStyle = TC.accent;
  [...name].forEach((c, i) => {
    ctx.fillText(c, cx, 520);
    cx += widths[i] + gap;
  });

  ctx.textAlign = 'center';
  ctx.font = `400 38px ${SANS}`;
  ctx.fillStyle = TC.ink;
  ctx.fillText('把内网服务暴露到公网，但只暴露一个必须认证的入口', W / 2, 596);

  ctx.font = `400 30px ${MONO}`;
  ctx.fillStyle = TC.muted;
  ctx.fillText('github.com/fzyt/ghost-firewall', W / 2, 666);

  ctx.strokeStyle = 'rgba(217,119,87,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 180, 704);
  ctx.lineTo(W / 2 + 180 * e, 704);
  ctx.stroke();
  ctx.restore();
}

window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = TC.bg;
  ctx.fillRect(0, 0, W, H);

  // clear 之后终端收掉，让位给品牌定格
  const out = clamp((u - BRAND_AT) / 0.5);
  const winAlpha = clamp(u / 0.45) * (1 - out);
  if (winAlpha > 0.01) {
    termWindow(ctx, {
      x: WIN.x, y: WIN.y, w: WIN.w, h: WIN.h, headH: WIN.headH,
      title: '~/ghost-firewall', right: 'zsh', font: MONO,
      alpha: winAlpha,
    });
    termScript(ctx, SCRIPT, { u, x: X0, y: Y0, lineH: LH, font: MONO, alpha: 1 - out });
  }

  drawBrand(u);

  termHUD(ctx, { index: 9, chapter: '收尾', font: MONO });
  termProgress(ctx, { u, duration: seg.duration, font: MONO, x: WIN.x, y: 996, w: WIN.w });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
</script>
</body>
</html>
