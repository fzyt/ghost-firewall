<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>01 定位</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp } from '../common.js';
import { TC, termWindow, termScript, termHUD, termProgress } from '../terminal.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment();

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

// 等宽负责英文与符号，中文回落 Noto Sans SC（成片机上没有带 CJK 的等宽字体）
const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';

const WIN = { x: 140, y: 140, w: 1640, h: 692, headH: 54 };
const X0 = WIN.x + 56;
const Y0 = WIN.y + WIN.headH + 56;
const LH = 40;

// 一行 = 一个动作。命令打完到出结果之间留一段空隙，像终端真在跑命令。
const SCRIPT = [
  { at: 0.4, k: '$', t: '' },
  { at: 0.9, k: 'c', t: '你有个跑在家里的服务，想让它从公网访问' },
  { at: 3.0, k: '$', t: 'nmap -sS -p- 198.51.100.24' },
  { at: 6.0, k: 'o', t: 'Not shown: 65535 filtered tcp ports (100% stealth rate)' },
  { at: 6.4, k: 'c', t: '默认不对外开任何入口 —— 扫过去只有沉默' },
  { at: 8.4, k: '$', t: 'knock 198.51.100.24 1 2 3 4' },
  { at: 11.2, k: 'o', t: '[OK] sequence accepted · entry opened on 8443', accent: true },
  { at: 11.6, k: '$', t: 'nmap -sS -p- 198.51.100.24' },
  { at: 14.6, k: 'o', t: 'PORT     STATE    SERVICE', dim: true },
  { at: 14.9, k: 'o', t: '8443/tcp open     https' },
  { at: 15.3, k: 'c', t: '敲对了门，入口才给你开' },
  { at: 17.0, k: '$', t: 'ghost-firewall status' },
  { at: 19.0, k: 'o', t: 'entry: 1   (knock required)' },
  { at: 19.4, k: 'c', t: '所有服务都汇进这一个入口，进门还得过认证' },
];

window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = TC.bg;
  ctx.fillRect(0, 0, W, H);

  termWindow(ctx, {
    x: WIN.x, y: WIN.y, w: WIN.w, h: WIN.h, headH: WIN.headH,
    title: '~/ghost-firewall', right: 'zsh', font: MONO,
    alpha: clamp(u / 0.45),
  });

  termScript(ctx, SCRIPT, { u, x: X0, y: Y0, lineH: LH, font: MONO });

  termHUD(ctx, { index: 1, chapter: '定位', font: MONO });
  termProgress(ctx, { u, duration: seg.duration, font: MONO, x: WIN.x, y: 996, w: WIN.w });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
</script>
</body>
</html>
