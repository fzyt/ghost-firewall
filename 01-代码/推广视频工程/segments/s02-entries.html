<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>02 架构</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp } from '../common.js';
import { TC, termWindow, termScript, termHUD, termProgress } from '../terminal.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment();

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';

const WIN = { x: 140, y: 200, w: 1640, h: 572, headH: 54 };
const X0 = WIN.x + 56;
const Y0 = WIN.y + WIN.headH + 56;
const LH = 40;

// 三个监听口：面板只在内网、认证只听本机，只有网关能映射公网
const SCRIPT = [
  { at: 0.4, k: '$', t: '' },
  { at: 0.8, k: '$', t: "ss -tlnp | grep -E '5443|8443|8444'" },
  { at: 3.4, k: 'o', t: 'LISTEN 0 511 127.0.0.1:8444  0.0.0.0:*  users:(("python3",pid=1330))' },
  { at: 3.7, k: 'o', t: 'LISTEN 0 511 0.0.0.0:5443    0.0.0.0:*  users:(("python3",pid=1201))' },
  { at: 4.0, k: 'o', t: 'LISTEN 0 511 *:8443            0.0.0.0:*  users:(("nginx",pid=980))' },
  { at: 4.8, k: 'c', t: '5443 面板只在内网 · 8444 认证服务只听本机 · 只有 8443 能映射公网' },
  { at: 7.0, k: '$', t: 'curl -sk --max-time 3 https://198.51.100.24:5443/' },
  { at: 10.0, k: 'o', t: 'curl: (28) Operation timed out after 3001 milliseconds', accent: true },
  { at: 10.4, k: '$', t: 'curl -sk --max-time 3 https://198.51.100.24:8443/' },
  { at: 13.0, k: 'o', t: 'HTTP/2 200' },
  { at: 13.4, k: 'c', t: '公网上暴露的入口，从一堆变成了一个' },
];

window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = TC.bg;
  ctx.fillRect(0, 0, W, H);

  termWindow(ctx, {
    x: WIN.x, y: WIN.y, w: WIN.w, h: WIN.h, headH: WIN.headH,
    title: '~/ghost-firewall', right: 'zsh', font: MONO,
    alpha: clamp(u / 0.45),
  });

  termScript(ctx, SCRIPT, { u, x: X0, y: Y0, lineH: LH, font: MONO });

  termHUD(ctx, { index: 2, chapter: '架构', font: MONO });
  termProgress(ctx, { u, duration: seg.duration, font: MONO, x: WIN.x, y: 996, w: WIN.w });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
</script>
</body>
</html>
