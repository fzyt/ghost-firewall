<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>04 安全性</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp } from '../common.js';
import { TC, termWindow, termScript, termHUD, termProgress } from '../terminal.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment();

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';

const WIN = { x: 140, y: 140, w: 1640, h: 812, headH: 54 };
const X0 = WIN.x + 56;
const Y0 = WIN.y + WIN.headH + 56;
const LH = 40;

// 三级惩罚：错误集 → 黑名单 → 手工解封；限流按来源地址分桶
const SCRIPT = [
  { at: 0.4, k: '$', t: '' },
  { at: 0.9, k: 'c', t: '敲错了要付代价' },
  { at: 2.7, k: '$', t: 'knock 198.51.100.24 9 9 9 9' },
  { at: 4.4, k: 'o', t: 'knock 1 -> wrong order   [warn] 进入惩罚窗口（30 秒）', accent: true },
  { at: 5.2, k: '$', t: 'ipset list error_ips' },
  { at: 6.4, k: 'o', t: 'Name: error_ips    Members: 198.51.100.99' },
  { at: 6.8, k: 'c', t: '惩罚窗口里再敲，直接进黑名单' },
  { at: 9.6, k: '$', t: 'knock 198.51.100.24 9 9 9 9' },
  { at: 11.3, k: 'o', t: '[block] 进入黑名单，只能管理员手工解封', accent: true },
  { at: 11.9, k: '$', t: 'ipset list blacklist' },
  { at: 13.1, k: 'o', t: 'Name: blacklist    Members: 198.51.100.99' },
  { at: 13.5, k: 'c', t: '限流按来源地址分桶 —— 攻击者只能限流自己' },
  { at: 16.4, k: '$', t: 'ghost-firewall ratelimit status' },
  { at: 17.6, k: 'o', t: 'bucket 203.0.113.7  12/20  drop   |  203.0.113.8  0/20  pass' },
  { at: 17.9, k: 'c', t: '拖不垮别人的敲门' },
  { at: 20.0, k: 'c', t: '能被打瘫的功能，不叫能用' },
];

window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = TC.bg;
  ctx.fillRect(0, 0, W, H);

  termWindow(ctx, {
    x: WIN.x, y: WIN.y, w: WIN.w, h: WIN.h, headH: WIN.headH,
    title: '~/ghost-firewall', right: 'zsh', font: MONO,
    alpha: clamp(u / 0.45),
  });

  termScript(ctx, SCRIPT, { u, x: X0, y: Y0, lineH: LH, font: MONO });

  termHUD(ctx, { index: 4, chapter: '惩罚', font: MONO });
  termProgress(ctx, { u, duration: seg.duration, font: MONO, x: WIN.x, y: 996, w: WIN.w });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
</script>
</body>
</html>
