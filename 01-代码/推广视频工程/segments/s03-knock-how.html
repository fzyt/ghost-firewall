<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>03 端口敲门</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp } from '../common.js';
import { TC, termWindow, termScript, termHUD, termProgress } from '../terminal.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment();

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';

const WIN = { x: 140, y: 140, w: 1640, h: 772, headH: 54 };
const X0 = WIN.x + 56;
const Y0 = WIN.y + WIN.headH + 56;
const LH = 40;

// 门外不是铁门，是空气：敲之前不回应，敲对之后才应
const SCRIPT = [
  { at: 0.4, k: '$', t: '' },
  { at: 0.9, k: 'c', t: '门外不是铁门，是空气' },
  { at: 2.4, k: '$', t: 'nc -vz -w 3 198.51.100.24 8443' },
  { at: 4.5, k: 'o', t: '(timeout: no response)', dim: true },
  { at: 4.9, k: 'c', t: '你敲，它不应；你不敲，它也不应' },
  { at: 7.0, k: '$', t: 'nmap -sS -p- 198.51.100.24' },
  { at: 9.1, k: 'o', t: 'Not shown: 65535 filtered tcp ports (100% stealth rate)' },
  { at: 9.5, k: 'c', t: '在公网上，它像一块石头' },
  { at: 11.6, k: '$', t: 'knock 198.51.100.24 1 2 3 4' },
  { at: 13.4, k: 'o', t: 'knock 1..4 -> ok   (each step within 8s)' },
  { at: 13.8, k: 'o', t: '[OK] sequence accepted · allowlist 5h', accent: true },
  { at: 14.4, k: '$', t: 'nc -vz -w 3 198.51.100.24 8443' },
  { at: 16.5, k: 'o', t: 'Connection to 198.51.100.24 8443 port [tcp/https] succeeded!' },
  { at: 16.9, k: 'c', t: '空气里才裂出一条缝，只有走对规则的人看得见' },
  { at: 19.0, k: '$', t: 'ipset list allowed4' },
  { at: 20.2, k: 'o', t: 'Name: allowed4    Members: 203.0.113.7' },
  { at: 20.6, k: 'c', t: '换个人来，它重新变回石头' },
];

window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = TC.bg;
  ctx.fillRect(0, 0, W, H);

  termWindow(ctx, {
    x: WIN.x, y: WIN.y, w: WIN.w, h: WIN.h, headH: WIN.headH,
    title: '~/ghost-firewall', right: 'zsh', font: MONO,
    alpha: clamp(u / 0.45),
  });

  termScript(ctx, SCRIPT, { u, x: X0, y: Y0, lineH: LH, font: MONO });

  termHUD(ctx, { index: 3, chapter: '敲门', font: MONO });
  termProgress(ctx, { u, duration: seg.duration, font: MONO, x: WIN.x, y: 996, w: WIN.w });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
</script>
</body>
</html>
