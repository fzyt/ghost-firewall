<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>08 一键装</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp, ease, TAU, drawCapsuleLabel, drawStamp } from '../common.js';
import { themeFromURL, chrome, drawGrain, drawVignette } from '../themes.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const theme = themeFromURL(location.search);
const HUD = chrome(theme);
const seg = createSegment({ duration: 14 });

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

// ---------- 调色板（coral-noir，与讲解页同一套） ----------
const C = {
  bg: '#0e0e0d', surface: '#1a1917', ink: '#f5f0e8', muted: '#8f8981',
  accent: '#d97757', accentSoft: '#f0b49c', line: 'rgba(245,240,232,0.10)',
};

// ---------- 文案（timeline.json → s08-install.copy，逐字照抄） ----------
const KICKER = '装它只要一条命令';
const TITLE = '零构建 · 零 CDN · 一键装';
const CMD = 'wget -O /tmp/setup.sh https://raw.githubusercontent.com/fzyt/ghost-firewall/main/nftables-publish-v0.7.9-nospa/setup/setup.sh && sh /tmp/setup.sh';
// CMD 按 token 折行显示，不增删任何字符（三行拼起来仍是 CMD 原文）
const CMD_LINES = [
  'wget -O /tmp/setup.sh',
  'https://raw.githubusercontent.com/fzyt/ghost-firewall/main/nftables-publish-v0.7.9-nospa/setup/setup.sh',
  '&& sh /tmp/setup.sh',
];
const POINTS = [
  '自动探测包管理器、装齐依赖',
  '自动生成自签证书、注册开机自启',
  'OpenWrt 24.10（opkg）与 25.x（apk）都支持',
];
const BADGES = ['零构建', '零 CDN', '开机自启'];
const PUNCH = 'clone 下来就能跑 —— 没有 npm、没有 webpack、没有依赖树';

// ---------- 版面常量 ----------
const HEAD = { kickerY: 196, titleY: 288 };
const TERM = { x: 96, y: 336, w: 1728, h: 306, barH: 50, padX: 26, lineH: 60 };
const TYPE_T0 = 2.0, TYPE_T1 = 5.5;          // 打字窗口
const CMD_CHARS = CMD_LINES.reduce((a, l) => a + l.length, 0);
const CPS = CMD_CHARS / (TYPE_T1 - TYPE_T0);  // 40 字/秒：已打字数 = 经过秒数 × CPS
const LIST = { x: 96, textX: 132, ys: [690, 752, 814] };
const BADGE = { right: 1824, ys: [686, 756, 826], h: 58 };
const RULE_X = 1596;
const PUNCH_Y = 950;

// ============================================================
// 节拍表（120 BPM，每拍 0.5s）
//   0.5-1.0   kicker 淡入
//   1.0-1.5   title 落下（outBack）
//   1.5-2.0   终端窗口从上往下展开
//   2.0-5.5   命令逐字符打出
//   5.5-6.0   回到新提示符，光标闪烁
//   6.0-9.0   setup.sh 自动做的事逐条淡入
//   9.0-10.2 三个徽章依次淡入
//   10.5-11.5 punchline 浮现
//   11.5-14.0 保持静帧
// ============================================================

// 终端正文字号：保证最长的那行 URL 塞得进终端内宽
function cmdFontSize(maxW) {
  for (let s = 27; s >= 13; s -= 0.5) {
    ctx.font = `500 ${s}px "JetBrains Mono", monospace`;
    let widest = 0;
    for (const l of CMD_LINES) widest = Math.max(widest, ctx.measureText('  ' + l).width);
    if (widest <= maxW) return s;
  }
  return 13;
}

// 把已打出的字符数分配到各行（换行不占字符预算）
function typedLines(chars) {
  const out = [];
  let left = chars;
  for (const line of CMD_LINES) {
    if (left <= 0) { out.push(''); continue; }
    if (left >= line.length) { out.push(line); left -= line.length; }
    else { out.push(line.slice(0, left)); left = 0; }
  }
  return out;
}

// ---------- 头部：kicker + 主标题 ----------
function drawHead(u) {
  const kp = clamp((u - 0.5) / 0.6, 0, 1);
  if (kp > 0) {
    ctx.save();
    ctx.globalAlpha = ease.outCubic(kp);
    ctx.font = '500 30px "JetBrains Mono", monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = C.accent;
    ctx.fillText(KICKER, 96, HEAD.kickerY);
    ctx.fillStyle = 'rgba(217,119,87,0.55)';
    ctx.fillRect(96, HEAD.kickerY + 14, 240 * ease.outCubic(kp), 2);
    ctx.restore();
  }

  const tp = clamp((u - 1.0) / 0.8, 0, 1);
  if (tp > 0) {
    const e = ease.outBack(tp);
    ctx.save();
    ctx.globalAlpha = clamp(tp * 2, 0, 1);
    ctx.translate(0, (1 - e) * -26);
    ctx.font = '700 76px "Noto Sans SC", sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = C.ink;
    ctx.fillText(TITLE, 96, HEAD.titleY);
    ctx.restore();
  }
}

// ---------- 终端窗口 + 打字机 ----------
function drawTerminal(u) {
  const wp = clamp((u - 1.5) / 0.5, 0, 1);
  if (wp <= 0) return;
  const we = ease.outCubic(wp);
  const h = TERM.h * we;

  ctx.save();
  ctx.globalAlpha = we;

  // 窗口体
  ctx.fillStyle = C.surface;
  ctx.beginPath();
  ctx.roundRect(TERM.x, TERM.y, TERM.w, h, 16);
  ctx.fill();
  ctx.strokeStyle = C.line;
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // 标题栏
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(TERM.x, TERM.y, TERM.w, h, 16);
  ctx.clip();
  ctx.fillStyle = 'rgba(245,240,232,0.045)';
  ctx.fillRect(TERM.x, TERM.y, TERM.w, TERM.barH);
  ctx.strokeStyle = C.line;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(TERM.x, TERM.y + TERM.barH);
  ctx.lineTo(TERM.x + TERM.w, TERM.y + TERM.barH);
  ctx.stroke();
  ctx.restore();

  // 三个圆点 + 窗口标签
  const dots = ['rgba(245,240,232,0.22)', 'rgba(245,240,232,0.16)', 'rgba(245,240,232,0.12)'];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = dots[i];
    ctx.beginPath();
    ctx.arc(TERM.x + 28 + i * 22, TERM.y + TERM.barH / 2, 5, 0, TAU);
    ctx.fill();
  }
  ctx.font = '400 18px "JetBrains Mono", monospace';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = C.muted;
  ctx.fillText('ssh root@openwrt:~#', TERM.x + 108, TERM.y + TERM.barH / 2 + 1);

  // 打字机正文
  const size = cmdFontSize(TERM.w - TERM.padX * 2);
  ctx.font = `500 ${size}px "JetBrains Mono", monospace`;
  const cw = ctx.measureText('M').width;
  const x0 = TERM.x + TERM.padX;
  const baseY = TERM.y + TERM.barH + 46;

  const typed = Math.floor(clamp(u - TYPE_T0, 0, TYPE_T1 - TYPE_T0) * CPS);
  const lines = typedLines(typed);

  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  for (let i = 0; i < CMD_LINES.length; i++) {
    const y = baseY + i * TERM.lineH;
    if (y > TERM.y + TERM.h - 10) break;
    if (i === 0) {
      ctx.fillStyle = C.accent;
      ctx.fillText('$', x0, y);
    }
    const indent = i === 0 ? 2 : 4;   // 折行缩进，视觉上仍是同一条命令
    ctx.fillStyle = C.ink;
    ctx.fillText(lines[i], x0 + indent * cw, y);
  }

  // 光标：打字时跟在最后一个字符后，打完后落到新提示符
  const done = typed >= CMD_CHARS;
  const blink = Math.floor(u * 2) % 2 === 0 ? 1 : 0.12;
  ctx.save();
  ctx.globalAlpha = we * blink;
  ctx.fillStyle = C.accent;
  if (done) {
    ctx.fillText('$', x0, baseY + 3 * TERM.lineH);
    ctx.fillRect(x0 + 2 * cw, baseY + 3 * TERM.lineH - size * 0.78, cw, size * 0.86);
  } else {
    let ci = -1, cl = 0;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].length) { ci = i; cl = lines[i].length; }
    }
    if (ci >= 0) {
      const indent = ci === 0 ? 2 : 4;
      const cx = x0 + (indent + cl) * cw;
      const cy = baseY + ci * TERM.lineH;
      ctx.fillRect(cx, cy - size * 0.78, cw, size * 0.86);
    }
  }
  ctx.restore();

  ctx.restore();
}

// ---------- setup.sh 自动做的事 ----------
function drawPoints(u) {
  for (let i = 0; i < POINTS.length; i++) {
    const p = clamp((u - (6.0 + i * 1.0)) / 0.6, 0, 1);
    if (p <= 0) continue;
    const e = ease.outCubic(p);
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate((1 - e) * -26, 0);

    ctx.fillStyle = C.accent;
    ctx.beginPath();
    ctx.roundRect(LIST.x, LIST.ys[i] - 10, 12, 12, 3);
    ctx.fill();

    ctx.font = '400 28px "Noto Sans SC", sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = C.ink;
    ctx.fillText(POINTS[i], LIST.textX, LIST.ys[i]);
    ctx.restore();
  }
}

// ---------- 三个徽章 ----------
function drawBadges(u) {
  // 竖线把徽章列和要点列分开
  const rp = clamp((u - 9.0) / 0.5, 0, 1);
  if (rp > 0) {
    ctx.save();
    ctx.globalAlpha = ease.outCubic(rp);
    ctx.fillStyle = 'rgba(217,119,87,0.45)';
    ctx.fillRect(RULE_X, BADGE.ys[0] - 14, 3, BADGE.h + 28 + (BADGE.ys[2] - BADGE.ys[0]));
    ctx.restore();
  }

  for (let i = 0; i < BADGES.length; i++) {
    const p = clamp((u - (9.0 + i * 0.4)) / 0.5, 0, 1);
    if (p <= 0) continue;
    const e = ease.outCubic(p);
    ctx.save();
    ctx.globalAlpha = e;
    ctx.font = '600 28px "Noto Sans SC", sans-serif';
    const tw = ctx.measureText(BADGES[i]).width;
    const w = tw + 34 + 12 + 34;
    const x = BADGE.right - w;
    const y = BADGE.ys[i];

    ctx.fillStyle = 'rgba(217,119,87,0.12)';
    ctx.beginPath();
    ctx.roundRect(x, y, w, BADGE.h, BADGE.h / 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(217,119,87,0.45)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.fillStyle = C.accent;
    ctx.beginPath();
    ctx.arc(x + 40, y + BADGE.h / 2, 6, 0, TAU);
    ctx.fill();

    ctx.fillStyle = C.accentSoft;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(BADGES[i], x + 58, y + BADGE.h / 2 + 1);
    ctx.restore();
  }
}

// ---------- punchline ----------
function drawPunch(u) {
  const p = clamp((u - 10.5) / 0.8, 0, 1);
  if (p <= 0) return;
  const e = ease.outCubic(p);
  ctx.save();
  ctx.globalAlpha = e;
  ctx.font = '600 40px "Noto Sans SC", sans-serif';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = C.accent;
  ctx.fillText(PUNCH, 124, PUNCH_Y);
  ctx.fillStyle = 'rgba(217,119,87,0.55)';
  ctx.fillRect(96, PUNCH_Y - 30, 3, 42);
  ctx.restore();
}

// ============================================================
window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  drawGrain(ctx, theme, W, H, u);

  drawHead(u);
  drawTerminal(u);
  drawPoints(u);
  drawBadges(u);
  drawPunch(u);

  drawVignette(ctx, W, H, 0.42);

  // HUD
  drawCapsuleLabel(ctx, 8, '一条命令', '安装', {
    numberColor: HUD.capsule.numberColor, textColor: HUD.capsule.textColor,
    bg: HUD.capsule.bg, border: HUD.capsule.border,
  });
  drawStamp(ctx, 'GHOST FIREWALL', { color: HUD.stamp.color });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono', 'Inter']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
</script>
</body>
</html>
