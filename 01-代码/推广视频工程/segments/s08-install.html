<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>08 安装</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp } from '../common.js';
import { TC, termWindow, termScript, termHUD, termProgress } from '../terminal.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment();

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';

const WIN = { x: 140, y: 140, w: 1640, h: 772, headH: 54 };
const X0 = WIN.x + 56;
const Y0 = WIN.y + WIN.headH + 56;
const LH = 40;

// 一条命令装完：依赖、证书、dnsmasq、开机自启全自动
const SCRIPT = [
  { at: 0.4, k: '$', t: '' },
  { at: 0.9, k: 'c', t: '装它只要一条命令' },
  { at: 2.7, k: '$', t: 'wget -qO /tmp/setup.sh https://raw.githubusercontent.com/fzyt/ghost-firewall/main/nftables-publish-v0.7.9-nospa/setup/setup.sh && sh /tmp/setup.sh' },
  { at: 8.0, k: 'o', t: '[1/6] 检测包管理器 ... opkg' },
  { at: 8.4, k: 'o', t: '[2/6] 安装依赖 ... nginx nftables' },
  { at: 8.8, k: 'o', t: '[3/6] 生成自签证书' },
  { at: 9.2, k: 'o', t: '[4/6] 写入 dnsmasq 解析' },
  { at: 9.6, k: 'o', t: '[5/6] 注册开机自启' },
  { at: 10.0, k: 'o', t: '[6/6] 面板已启动', accent: true },
  { at: 10.4, k: 'c', t: '依赖、nginx 配置、项目部署全自动完成' },
  { at: 12.0, k: '$', t: 'ghost-firewall info' },
  { at: 13.0, k: 'o', t: 'panel   : https://192.168.100.224:5443' },
  { at: 13.4, k: 'o', t: 'gateway : 8443  (knock required)' },
  { at: 13.8, k: 'c', t: 'OpenWrt 24.10 和 25.x 都支持，没有 npm，没有 webpack' },
];

window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = TC.bg;
  ctx.fillRect(0, 0, W, H);

  termWindow(ctx, {
    x: WIN.x, y: WIN.y, w: WIN.w, h: WIN.h, headH: WIN.headH,
    title: '~/ghost-firewall', right: 'zsh', font: MONO,
    alpha: clamp(u / 0.45),
  });

  termScript(ctx, SCRIPT, { u, x: X0, y: Y0, lineH: LH, font: MONO, cps: 0.045 });

  termHUD(ctx, { index: 8, chapter: '安装', font: MONO });
  termProgress(ctx, { u, duration: seg.duration, font: MONO, x: WIN.x, y: 996, w: WIN.w });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
</script>
</body>
</html>
