<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>05 认证网关</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { createSegment, loadFonts, clamp } from '../common.js';
import { TC, termWindow, termScript, termHUD, termProgress } from '../terminal.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const seg = createSegment();

window.DURATION = seg.duration;
window.__ready = false;
window.__bootError = null;

const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';

const WIN = { x: 140, y: 180, w: 1640, h: 652, headH: 54 };
const X0 = WIN.x + 56;
const Y0 = WIN.y + WIN.headH + 56;
const LH = 40;

// 十个内网服务 → 公网一个入口，按路径前缀分流
const SCRIPT = [
  { at: 0.4, k: '$', t: '' },
  { at: 0.9, k: 'c', t: '内网有十个服务，公网不需要十个端口' },
  { at: 3.0, k: '$', t: 'ls /srv/services/' },
  { at: 3.9, k: 'o', t: 'service-01  service-02  service-03  ...  service-10' },
  { at: 4.4, k: '$', t: 'cat /etc/nginx/conf.d/00-nftables-web-gateway.conf' },
  { at: 7.8, k: 'o', t: 'location / {' },
  { at: 8.1, k: 'o', t: '    proxy_pass http://127.0.0.1:8080;' },
  { at: 8.4, k: 'o', t: '}' },
  { at: 8.8, k: '$', t: 'curl -s http://127.0.0.1:8443/' },
  { at: 9.9, k: 'o', t: 'Ghost Firewall —— 请选择服务' },
  { at: 10.3, k: 'c', t: '按路径前缀分流，登录一次就是一张服务卡片列表' },
  { at: 12.6, k: '$', t: 'ss -tlnp | grep 8443' },
  { at: 13.7, k: 'o', t: 'LISTEN 0 511 *:8443  0.0.0.0:*  users:(("nginx",pid=980))' },
  { at: 14.1, k: 'c', t: '公网上只暴露这一个入口，而且它必须先过认证' },
];

window.renderFrame = (u) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = TC.bg;
  ctx.fillRect(0, 0, W, H);

  termWindow(ctx, {
    x: WIN.x, y: WIN.y, w: WIN.w, h: WIN.h, headH: WIN.headH,
    title: '~/ghost-firewall', right: 'zsh', font: MONO,
    alpha: clamp(u / 0.45),
  });

  termScript(ctx, SCRIPT, { u, x: X0, y: Y0, lineH: LH, font: MONO });

  termHUD(ctx, { index: 5, chapter: '汇聚', font: MONO });
  termProgress(ctx, { u, duration: seg.duration, font: MONO, x: WIN.x, y: 996, w: WIN.w });
};

(async () => {
  try {
    await loadFonts(['Noto Sans SC', 'JetBrains Mono']);
    window.__ready = true;
  } catch (e) {
    window.__bootError = String(e);
  }
})();
</script>
</body>
</html>
