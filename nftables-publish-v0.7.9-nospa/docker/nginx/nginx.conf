# nginx 基础配置（容器内）
#
# 只做两件事：
#   1. 允许面板把生成的网关配置丢进 conf.d/ 后被 include
#   2. 给 nginx 一个"必须有"的最小 server（否则某些 nginx 版本会拒绝启动）
#
# 面板本体**不经过 nginx**（它是自己的 HTTPS 服务，直接监听 5443）。
# 8443 才是网关端口，配置由面板生成到 $NFTABLES_WEB_NGINX_CONF_DIR。

user  root;
worker_processes  auto;
pid  /run/nginx.pid;
error_log  /data/log/nginx-error.log warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /data/nginx/tmp/body;
    proxy_temp_path       /data/nginx/tmp/proxy;
    fastcgi_temp_path     /data/nginx/tmp/fastcgi;
    uwsgi_temp_path       /data/nginx/tmp/uwsgi;
    scgi_temp_path        /data/nginx/tmp/scgi;

    sendfile      on;
    keepalive_timeout  65;

    # 面板生成的网关配置在这里（00-nftables-web-gateway.conf）
    include /data/nginx/conf.d/*.conf;

    # nginx 必须至少有一个 server —— 面板没启用网关时用它顶着
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        access_log off;
        location / { return 200 "nftables-web-v2 test env\n"; }
    }
}
