<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>服务门户 · Ghost Firewall</title>
<link rel="stylesheet" href="/auth/static/base.css">
</head>
<body>

<div class="portal">
  <header class="p-head">
    <div class="p-title">
      <h1>服务门户</h1>
      <p id="who">正在校验登录状态…</p>
    </div>
    <div class="p-actions">
      <span id="timer" class="pill" hidden>剩余 <b id="left">--:--</b></span>
      <button id="logout" class="ghost" type="button">退出</button>
    </div>
  </header>

  <main id="main" class="grid"></main>
  <p id="empty" class="empty" hidden>还没有配置任何服务。<br>去管理面板的「反向代理」里给规则填一个路径前缀，即可出现在这里。</p>
</div>

<script src="/auth/static/fingerprint.js"></script>
<script src="/auth/static/portal.js"></script>
</body>
</html>
